version: '3.8'

services:
  soc-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./ml:/app/ml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  soc-dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3002:3002"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - soc-api
